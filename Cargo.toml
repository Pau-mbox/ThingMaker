[workspace]
resolver = "2"
members = [
  "crates/thingmaker-supervisor",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.90"

[workspace.dependencies]
# Exact pins (spec section 6). Bump deliberately; CI compares against Cargo.lock.
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs", "net"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
thiserror = "=2.0.20"
anyhow = "=1.0.104"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "env-filter", "std"] }
uuid = { version = "=1.26.0", features = ["v4", "serde"] }
blake3 = "=1.8.7"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
tempfile = "=3.27.0"
clap = { version = "=4.6.6", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
panic = "abort"
