# ThingMaker's phone relay: the Mac and the phone both connect out to this
# Worker on your account's workers.dev address, and it carries the phone
# bridge between them. Put it behind Cloudflare Access (the Worker's Access
# tab) with a service token; the README has the steps.
name = "thingmaker-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]
